name: JWT Feature Request
description: Suggest a new JWT API, utility, or improvement
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve with JWT? What functionality is missing or awkward in the current API?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the JWT API, behavior, or output you'd like to see.
      placeholder: |
        ```typescript
        import { jwt } from '@panmdaa/jwt'

        const token = jwt.sign(payload, secret, {
          expiresIn: '1h'
        })
        ```
    validations:
      required: true

  - type: textarea
    id: token
    attributes:
      label: JWT Requirements
      description: Describe any requirements related to signing, verification, claims, expiration, algorithms, or token structure.
      placeholder: |
        - Algorithm: HS256
        - Expiration: 1 hour
        - Required claims: sub, iat, exp
        - Verification behavior: ...
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any workarounds, existing JWT libraries, or alternative approaches you've tried.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Links, references, examples, or APIs from other JWT libraries that could help define the feature.
    validations:
      required: false
