name: Bug Report
description: Report incorrect output, crashes, or unexpected behavior in the JWT library
labels: [bug]

body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version of the JWT library are you using?
      placeholder: 0.1.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect to happen?
      placeholder: |
        Example: Tokens with algorithm "none" are not properly rejected
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal code that reproduces the issue.
      render: typescript
      value: |
        // Example reproduction code
        import { sign, verify } from "./src/index";

        // Issue 1: Algorithm "none" should be rejected
        try {
          const token = sign({ sub: "user" }, "secret", { alg: "none" });
          verify(token, "secret", { algorithms: ["HS256"] });
        } catch (e) {
          console.log(e.name, e.message);
        }

    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node version, runtime (Node / Bun / browser), OS.
      placeholder: |
        Node 22.x, Ubuntu 24.04
    validations:
      required: false