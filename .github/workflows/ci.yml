name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 23]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm install

      - run: npm run typecheck

      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Format check
        continue-on-error: true
        run: npm run format

      - run: npm test

      - run: npm run build
